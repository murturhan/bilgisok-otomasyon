name: Jess Greeting Üret

on:
  workflow_dispatch:

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install ffmpeg + rubberband
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librubberband-dev
      
      - name: Install Node dependencies
        run: npm install googleapis
      
      - name: Run jess-greeting-uret
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/jess-greeting-uret.js
      
      - name: Upload jess-audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jess-audio
          path: jess-audio/
          retention-days: 30
