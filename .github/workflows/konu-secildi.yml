name: Konu Seçildi - İçerik ve Görsel Üretimi
on:
  repository_dispatch:
    types: [konu_secildi]
  workflow_dispatch:
    inputs:
      tarih:
        description: 'Tarih (örn: 13.05.2026)'
        required: true
      index:
        description: 'Konu indexi (0-4)'
        required: true
        default: '0'
      chat_id:
        description: 'Telegram chat ID'
        required: false
        default: '6090600843'
jobs:
  icerik-ve-gorsel-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: NPM dependencies yükle
        run: |
          npm init -y
          npm install --no-save \
            @google/generative-ai \
            googleapis \
            axios \
            form-data
      
      - name: Parametreleri belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tarih=${{ github.event.client_payload.tarih }}" >> $GITHUB_OUTPUT
            echo "index=${{ github.event.client_payload.index }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
          else
            echo "tarih=${{ github.event.inputs.tarih }}" >> $GITHUB_OUTPUT
            echo "index=${{ github.event.inputs.index }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.inputs.chat_id }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Telegram - işlem başladı bildirimi
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.params.outputs.chat_id }}
          TARIH: ${{ steps.params.outputs.tarih }}
          INDEX: ${{ steps.params.outputs.index }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${CHAT_ID}\",\"text\":\"📝 İçerik üretiliyor (Gemini)...\\n\\n📅 ${TARIH}\\n🔢 Konu #${INDEX}\"}"
      
      - name: Script - icerik ve gorsel uret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
          CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
          CLOUDFLARE_API_TOKEN_3: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
          CLOUDFLARE_ACCOUNT_ID_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
          CLOUDFLARE_HESAP_A_KOTADA: ${{ vars.CLOUDFLARE_HESAP_A_KOTADA }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ steps.params.outputs.chat_id }}
          TARIH: ${{ steps.params.outputs.tarih }}
          INDEX: ${{ steps.params.outputs.index }}
        run: node scripts/icerik-ve-gorsel.js
