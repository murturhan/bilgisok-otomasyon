# REV 001/01JUN26 - Drive SA diagnoz workflow (tek kullanim, sil sonra)
name: 99 - GDrive SA Diagnoz
on:
  workflow_dispatch:

jobs:
  diagnoz:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install googleapis
        run: npm install googleapis

      - name: Drive SA Diagnoz
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SURPRISE_BOX_FOLDER_ID: ${{ secrets.GDRIVE_SURPRISE_BOX_FOLDER_ID }}
        run: |
          node --input-type=module << 'EOF'
          import { google } from 'googleapis';

          const saJson = JSON.parse(process.env.GDRIVE_SERVICE_ACCOUNT_JSON);
          console.log('=== SA EMAIL ===');
          console.log(saJson.client_email);

          const auth = new google.auth.GoogleAuth({
            credentials: saJson,
            scopes: ['https://www.googleapis.com/auth/drive.readonly']
          });
          const drive = google.drive({ version: 'v3', auth: await auth.getClient() });

          console.log('\n=== a) ANA KLASOR ===');
          console.log('GDRIVE_FOLDER_ID:', process.env.GDRIVE_FOLDER_ID);
          try {
            const ana = await drive.files.get({ fileId: process.env.GDRIVE_FOLDER_ID, fields: 'id,name' });
            console.log('Ana klasor:', ana.data);
          } catch (e) {
            console.log('Ana klasor ERROR:', e.message);
          }

          console.log('\n=== b) ALT KLASORLER ===');
          try {
            const altlar = await drive.files.list({
              q: `'${process.env.GDRIVE_FOLDER_ID}' in parents and mimeType = 'application/vnd.google-apps.folder' and trashed = false`,
              fields: 'files(id,name)'
            });
            console.log('Alt klasorler:', JSON.stringify(altlar.data.files, null, 2));
          } catch (e) {
            console.log('Alt klasorler ERROR:', e.message);
          }

          console.log('\n=== c) 05-Surprise-Box DIREKT ID ===');
          try {
            const sb = await drive.files.get({ fileId: '1WKEoJLtcVeuZPVAP3ME8lRcdr4Ta65Tz', fields: 'id,name,parents' });
            console.log('05-Surprise-Box direkt:', sb.data);
          } catch (e) {
            console.log('05-Surprise-Box direkt ERROR:', e.message);
          }

          console.log('\n=== d) GDRIVE_SURPRISE_BOX_FOLDER_ID ===');
          console.log('GDRIVE_SURPRISE_BOX_FOLDER_ID:', process.env.GDRIVE_SURPRISE_BOX_FOLDER_ID);
          if (process.env.GDRIVE_SURPRISE_BOX_FOLDER_ID) {
            try {
              const sb2 = await drive.files.get({ fileId: process.env.GDRIVE_SURPRISE_BOX_FOLDER_ID, fields: 'id,name,parents' });
              console.log('Surprise-Box secret ID ile:', sb2.data);
            } catch (e) {
              console.log('Surprise-Box secret ID ERROR:', e.message);
            }
          } else {
            console.log('GDRIVE_SURPRISE_BOX_FOLDER_ID tanimli degil!');
          }
          EOF
