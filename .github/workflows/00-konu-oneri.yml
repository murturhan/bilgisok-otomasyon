name: 00 - Konu Öneri

on:
  # Manuel tetikleme (GitHub UI)
  workflow_dispatch:
  # Worker'dan /konu_oner komutu ile tetikleme
  repository_dispatch:
    types: [konu_oner]

jobs:
  konu-oner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install deps
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save googleapis
      
      - name: Run konu öneri
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
        run: node scripts/00-konu-oneri.js
