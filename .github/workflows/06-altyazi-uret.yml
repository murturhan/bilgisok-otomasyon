name: 06 - Altyazı Üret
on:
  repository_dispatch:
    types: [altyazi_uret]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (run_id)'
        required: true

permissions:
  actions: write
  contents: read

jobs:
  altyazi-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: FFmpeg kur (süre ölçümü için)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: NPM dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save \
            googleapis \
            axios \
            msedge-tts
      
      - name: Job ID belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "job_id=${{ github.event.client_payload.job_id }}" >> $GITHUB_OUTPUT
          else
            echo "job_id=${{ github.event.inputs.job_id }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Altyazı üret
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
        run: node scripts/06-altyazi-uret.js
      
      # Altyazı bittikten sonra 07-Video Montaj otomatik tetikle
      - name: 07-Video Montaj tetikle
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_PAT }}
        run: |
          # 60 saniye bekle - 02-gorsel ve 03-seslendirme bitmiş olsun
          echo "60 saniye bekleniyor (diğer materyallerin bitmesi için)..."
          sleep 60
          
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"video_montaj\",\"client_payload\":{\"job_id\":\"${{ steps.params.outputs.job_id }}\"}}"
          
          echo "✅ 07-Video Montaj tetiklendi"
