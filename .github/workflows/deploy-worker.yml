# REV 002/16SEP26 - --no-bundle kaldirildi + path filtresine shared/ ve bu dosya eklendi
name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - wrangler.toml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # --no-bundle KALDIRILDI: worker.js artik shared/jess-intro.js i import ediyor
          # ve --no-bundle relative importu cozmuyordu (deploy 15SEP26 21:27 de fail etti).
          # Bundling wrangler in varsayilani; dry-run ile dogrulandi (tek modul, 209 KiB).
          npx wrangler@4 deploy

      - name: Sync secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_GITHUB_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          WORKER_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          WORKER_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          WORKER_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          WORKER_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          echo "$WORKER_GITHUB_TOKEN" | npx wrangler@4 secret put GITHUB_TOKEN
          echo "$WORKER_OAUTH_CLIENT_ID" | npx wrangler@4 secret put GOOGLE_OAUTH_CLIENT_ID
          echo "$WORKER_OAUTH_CLIENT_SECRET" | npx wrangler@4 secret put GOOGLE_OAUTH_CLIENT_SECRET
          echo "$WORKER_OAUTH_REFRESH_TOKEN" | npx wrangler@4 secret put GOOGLE_OAUTH_REFRESH_TOKEN
          echo "$WORKER_TELEGRAM_BOT_TOKEN" | npx wrangler@4 secret put TELEGRAM_BOT_TOKEN
