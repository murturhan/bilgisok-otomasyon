name: 08 - YouTube Upload
on:
  repository_dispatch:
    types: [youtube_upload]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (run_id)'
        required: true
      privacy:
        description: 'Privacy (private/unlisted/public)'
        required: false
        default: 'private'

jobs:
  youtube-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: NPM dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save \
            googleapis \
            axios
      
      - name: Job ID belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "job_id=${{ github.event.client_payload.job_id }}" >> $GITHUB_OUTPUT
            echo "privacy=${{ github.event.client_payload.privacy || 'private' }}" >> $GITHUB_OUTPUT
          else
            echo "job_id=${{ github.event.inputs.job_id }}" >> $GITHUB_OUTPUT
            echo "privacy=${{ github.event.inputs.privacy || 'private' }}" >> $GITHUB_OUTPUT
          fi
      
      - name: YouTube upload
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ steps.params.outputs.privacy }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
        run: node scripts/08-youtube-upload.js
