# REV 001/04JUN26 - stage input eklendi (Parça 3/4: skip_stage2 akışı için)
name: 03 - Seslendirme Üret

on:
  repository_dispatch:
    types: [seslendirme_uret]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (run_id)'
        required: true
      stage:
        description: 'Aşama (skipped=02 atlandı, normal=02 tamamlandı)'
        required: false
        default: 'normal'
jobs:
  seslendirme-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: FFmpeg kur (MP3 birleştirme için)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: NPM dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save \
            googleapis \
            axios
      
      - name: Parametreleri belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "job_id=${{ github.event.client_payload.job_id }}" >> $GITHUB_OUTPUT
            echo "stage=${{ github.event.client_payload.stage || 'normal' }}" >> $GITHUB_OUTPUT
          else
            echo "job_id=${{ github.event.inputs.job_id }}" >> $GITHUB_OUTPUT
            echo "stage=${{ github.event.inputs.stage || 'normal' }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Seslendirme üret (Google Cloud TTS)
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
          STAGE: ${{ steps.params.outputs.stage }}
        run: node scripts/03-seslendirme-uret.js
