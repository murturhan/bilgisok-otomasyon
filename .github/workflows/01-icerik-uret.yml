# REV 005/09JUN26 - include_intro/include_outro destegi
name: 01 - İçerik Üret
# REVISION: paralel dispatch'ler kaldırıldı, akış sıralı (01→02 kod tetikler) 2026-05-25

on:
  repository_dispatch:
    types: [icerik_uret]
  workflow_dispatch:
    inputs:
      tarih:
        description: 'Tarih (örn: 13.05.2026)'
        required: true
      index:
        description: 'Konu indexi (0-2)'
        required: true
        default: '0'
      chat_id:
        description: 'Telegram chat ID'
        required: false
        default: '6090600843'
      video_format:
        description: 'Format: shorts veya long'
        required: false
        default: 'long'
      test_mode:
        description: 'Test modu (true = 1 soru üret)'
        type: boolean
        required: false
        default: false
      question_type:
        description: 'Soru tipi: multiple_choice veya would_you_rather'
        required: false
        default: 'multiple_choice'
      konu_override:
        description: 'Konu metni (override - boşsa havuzdan alınır)'
        required: false
        default: ''
      n_soru:
        description: 'Toplam soru sayısı (boşsa format bazlı: long=25)'
        required: false
        default: ''
      soru_tipi_json:
        description: 'Karma tip JSON, örn: {"multiple_choice":15,"would_you_rather":5}'
        required: false
        default: ''
      dil:
        description: 'İçerik dili (English, Turkish, Spanish, French...)'
        required: false
        default: 'English'
      include_intro:
        description: 'İntro sahnesi olsun (true/false)'
        required: false
        default: 'true'
      include_outro:
        description: 'Outro sahnesi olsun (true/false)'
        required: false
        default: 'true'

permissions:
  actions: write
  contents: read

jobs:
  icerik-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: NPM dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save \
            @google/generative-ai \
            googleapis \
            axios
      
      - name: Parametreleri belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tarih=${{ github.event.client_payload.tarih }}" >> $GITHUB_OUTPUT
            echo "index=${{ github.event.client_payload.index }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
            echo "video_format=${{ github.event.client_payload.video_format || 'long' }}" >> $GITHUB_OUTPUT
            echo "test_mode=${{ github.event.client_payload.test_mode || 'false' }}" >> $GITHUB_OUTPUT
            echo "job_id=${{ github.event.client_payload.job_id || github.run_id }}" >> $GITHUB_OUTPUT
            echo "question_type=${{ github.event.client_payload.question_type || 'multiple_choice' }}" >> $GITHUB_OUTPUT
            echo "konu_override=${{ github.event.client_payload.konu_override }}" >> $GITHUB_OUTPUT
            echo "n_soru=${{ github.event.client_payload.n_soru }}" >> $GITHUB_OUTPUT
            echo "dil=${{ github.event.client_payload.dil || 'English' }}" >> $GITHUB_OUTPUT
            printf 'soru_tipi_json=%s\n' '${{ github.event.client_payload.soru_tipi_json }}' >> $GITHUB_OUTPUT
            echo "include_intro=${{ github.event.client_payload.include_intro != false && 'true' || 'false' }}" >> $GITHUB_OUTPUT
            echo "include_outro=${{ github.event.client_payload.include_outro != false && 'true' || 'false' }}" >> $GITHUB_OUTPUT
          else
            echo "tarih=${{ github.event.inputs.tarih }}" >> $GITHUB_OUTPUT
            echo "index=${{ github.event.inputs.index }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.inputs.chat_id }}" >> $GITHUB_OUTPUT
            echo "video_format=${{ github.event.inputs.video_format || 'long' }}" >> $GITHUB_OUTPUT
            echo "test_mode=${{ github.event.inputs.test_mode || 'false' }}" >> $GITHUB_OUTPUT
            echo "job_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
            echo "question_type=${{ github.event.inputs.question_type || 'multiple_choice' }}" >> $GITHUB_OUTPUT
            echo "konu_override=${{ github.event.inputs.konu_override }}" >> $GITHUB_OUTPUT
            echo "n_soru=${{ github.event.inputs.n_soru }}" >> $GITHUB_OUTPUT
            echo "dil=${{ github.event.inputs.dil || 'English' }}" >> $GITHUB_OUTPUT
            printf 'soru_tipi_json=%s\n' '${{ github.event.inputs.soru_tipi_json }}' >> $GITHUB_OUTPUT
            echo "include_intro=${{ github.event.inputs.include_intro || 'true' }}" >> $GITHUB_OUTPUT
            echo "include_outro=${{ github.event.inputs.include_outro || 'true' }}" >> $GITHUB_OUTPUT
          fi
      
      - name: İçerik üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARIH: ${{ steps.params.outputs.tarih }}
          INDEX: ${{ steps.params.outputs.index }}
          CHAT_ID: ${{ steps.params.outputs.chat_id }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
          VIDEO_FORMAT: ${{ steps.params.outputs.video_format }}
          TEST_MODE: ${{ steps.params.outputs.test_mode }}
          QUESTION_TYPE: ${{ steps.params.outputs.question_type }}
          KONU_OVERRIDE: ${{ steps.params.outputs.konu_override }}
          N_SORU: ${{ steps.params.outputs.n_soru }}
          SORU_TIPI_JSON: ${{ steps.params.outputs.soru_tipi_json }}
          DIL: ${{ steps.params.outputs.dil }}
          INCLUDE_INTRO: ${{ steps.params.outputs.include_intro }}
          INCLUDE_OUTRO: ${{ steps.params.outputs.include_outro }}
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/01-icerik-uret.js
      
      # 01.5-İçerik Onay tetikle (02-gorsel-uret artık kullanıcı onayından sonra tetiklenecek)
      - name: 01.5-İçerik Onay tetikle
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/01.5-icerik-onay.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"job_id\":\"${{ steps.params.outputs.job_id }}\",\"chat_id\":\"${{ steps.params.outputs.chat_id }}\",\"tarih\":\"${{ steps.params.outputs.tarih }}\",\"video_format\":\"${{ steps.params.outputs.video_format }}\",\"question_type\":\"${{ steps.params.outputs.question_type }}\"}}"

      # 05-Thumbnail tetikle (paralel - 01 sonrası, onaydan bağımsız)
      - name: 05-Thumbnail tetikle
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"thumbnail_uret\",\"client_payload\":{\"job_id\":\"${{ steps.params.outputs.job_id }}\",\"question_type\":\"${{ steps.params.outputs.question_type }}\"}}"
