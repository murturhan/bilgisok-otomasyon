# REV 001/26MAY26 - test_mode input eklendi
name: 01 - İçerik Üret
# REVISION: paralel dispatch'ler kaldırıldı, akış sıralı (01→02 kod tetikler) 2026-05-25

on:
  repository_dispatch:
    types: [icerik_uret]
  workflow_dispatch:
    inputs:
      tarih:
        description: 'Tarih (örn: 13.05.2026)'
        required: true
      index:
        description: 'Konu indexi (0-2)'
        required: true
        default: '0'
      chat_id:
        description: 'Telegram chat ID'
        required: false
        default: '6090600843'
      video_format:
        description: 'Format: shorts veya long'
        required: false
        default: 'long'
      test_mode:
        description: 'Test modu (true = 1 soru üret)'
        type: boolean
        required: false
        default: false

permissions:
  actions: write
  contents: read

jobs:
  icerik-uret:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: NPM dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save \
            @google/generative-ai \
            googleapis \
            axios
      
      - name: Parametreleri belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tarih=${{ github.event.client_payload.tarih }}" >> $GITHUB_OUTPUT
            echo "index=${{ github.event.client_payload.index }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.client_payload.chat_id }}" >> $GITHUB_OUTPUT
            echo "video_format=${{ github.event.client_payload.video_format || 'long' }}" >> $GITHUB_OUTPUT
            echo "test_mode=${{ github.event.client_payload.test_mode || 'false' }}" >> $GITHUB_OUTPUT
            echo "job_id=${{ github.event.client_payload.job_id || github.run_id }}" >> $GITHUB_OUTPUT
          else
            echo "tarih=${{ github.event.inputs.tarih }}" >> $GITHUB_OUTPUT
            echo "index=${{ github.event.inputs.index }}" >> $GITHUB_OUTPUT
            echo "chat_id=${{ github.event.inputs.chat_id }}" >> $GITHUB_OUTPUT
            echo "video_format=${{ github.event.inputs.video_format || 'long' }}" >> $GITHUB_OUTPUT
            echo "test_mode=${{ github.event.inputs.test_mode || 'false' }}" >> $GITHUB_OUTPUT
            echo "job_id=${{ github.run_id }}" >> $GITHUB_OUTPUT
          fi
      
      - name: İçerik üret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARIH: ${{ steps.params.outputs.tarih }}
          INDEX: ${{ steps.params.outputs.index }}
          CHAT_ID: ${{ steps.params.outputs.chat_id }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
          VIDEO_FORMAT: ${{ steps.params.outputs.video_format }}
          TEST_MODE: ${{ steps.params.outputs.test_mode }}
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
        run: node scripts/01-icerik-uret.js
      
      # 05-Thumbnail tetikle (paralel - 01 sonrası, 02 ile aynı zamanda)
      - name: 05-Thumbnail tetikle
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
        run: |
          curl -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/dispatches" \
            -d "{\"event_type\":\"thumbnail_uret\",\"client_payload\":{\"job_id\":\"${{ steps.params.outputs.job_id }}\"}}"
