# REV 001/27EKI26 - icerik dogrulama testi: mevcut job'in questions.json'u uzerinde dogrulama gecisi (sadece okur, Drive'a yazmaz, baska workflow tetiklemez)
name: TEST - Icerik Dogrula

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (questions.json bu job Drive klasorunden okunur)'
        required: true
        default: 'U2610250415L'

permissions:
  contents: read
  issues: read

jobs:
  test-icerik-dogrula:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # package.json'da yok -> acikca kur (01-icerik-uret.yml ile ayni)
      - name: NPM dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save \
            @google/generative-ai \
            googleapis \
            axios

      - name: Icerik dogrulama testi
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          # icerik-dogrula-test.js job issue'sunu gh ile okur (sadece okuma)
          GH_TOKEN: ${{ github.token }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          set -o pipefail
          node scripts/icerik-dogrula-test.js "$JOB_ID" 2>&1 | tee dogrulama-cikti.txt
          {
            echo '### Icerik dogrulama — '"$JOB_ID"
            echo '```'
            cat dogrulama-cikti.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
