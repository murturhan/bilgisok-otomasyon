name: 07 - Video Montaj
on:
  repository_dispatch:
    types: [video_montaj]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID (run_id)'
        required: true
jobs:
  video-montaj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: FFmpeg ve rubberband kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg librubberband-dev
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: NPM dependencies
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save \
            googleapis \
            axios \
            sharp
      - name: Job ID belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "job_id=${{ github.event.client_payload.job_id }}" >> $GITHUB_OUTPUT
          else
            echo "job_id=${{ github.event.inputs.job_id }}" >> $GITHUB_OUTPUT
          fi
      - name: Video montaj
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_MUZIK_FOLDER_ID: ${{ secrets.GDRIVE_MUZIK_FOLDER_ID }}
          GDRIVE_JESS_FOLDER_ID: ${{ secrets.GDRIVE_JESS_FOLDER_ID }}
          GDRIVE_SFX_FOLDER_ID: ${{ secrets.GDRIVE_SFX_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
        run: node scripts/07-video-montaj.js
