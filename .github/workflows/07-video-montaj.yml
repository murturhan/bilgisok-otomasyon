# REV 000/25MAY26 - video_montaj event tipi + WORKFLOW_DISPATCH_TOKEN
name: 07 - Video Montaj
# REVISION: video_montaj event tipi + WORKFLOW_DISPATCH_TOKEN 2026-05-25
# NOT: Bu dosyayı reponda olanın üstüne YAZMA - sadece şu eksikleri EKLE:
#   1) on.repository_dispatch.types listesinde "video_montaj" olmalı
#   2) env bloğunda WORKFLOW_DISPATCH_TOKEN, WORKER_URL, GITHUB_REPO_OWNER, GITHUB_REPO_NAME olmalı

on:
  repository_dispatch:
    types: [video_montaj]
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: true

jobs:
  video-montaj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: System dependencies (ffmpeg + chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser
      
      - name: Remotion deps
        working-directory: remotion
        run: npm install
      
      - name: Script deps
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save googleapis axios
      
      - name: Job ID belirle
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "job_id=${{ github.event.client_payload.job_id }}" >> $GITHUB_OUTPUT
          else
            echo "job_id=${{ github.event.inputs.job_id }}" >> $GITHUB_OUTPUT
          fi
      
      - name: Video montaj
        env:
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GSHEETS_SPREADSHEET_ID: ${{ secrets.GSHEETS_SPREADSHEET_ID }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          JOB_ID: ${{ steps.params.outputs.job_id }}
        run: node scripts/07-video-montaj.js
